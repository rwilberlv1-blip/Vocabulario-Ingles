<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Repaso Inglés: Objetos del Comedor</title>
    <style>
        :root {
            --primary: #e67e22; /* Color naranja zanahoria para el comedor */
            --success: #2ecc71;
            --error: #e74c3c;
            --bg: #fdfaf6;
        }

        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg); 
            padding: 20px; 
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .card { 
            background: white; 
            padding: 25px; 
            border-radius: 30px; 
            max-width: 750px; 
            width: 100%;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            border: 4px solid #f39c12; 
        }

        h2 { 
            text-align: center; 
            margin-bottom: 5px; 
            color: #2c3e50;
            text-transform: uppercase;
            font-size: 24px;
        }

        p.subtitle { 
            text-align: center; 
            color: #7f8c8d; 
            margin-bottom: 20px; 
            font-weight: 500;
        }

        .image-container {
            width: 100%;
            border-radius: 20px;
            margin-bottom: 25px;
            overflow: hidden;
            border: 2px solid #ecf0f1;
        }

        .main-image { width: 100%; height: auto; display: block; }

        #quiz {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        @media (max-width: 600px) { #quiz { grid-template-columns: 1fr; } }

        .row { 
            background: #fff9f0;
            padding: 10px;
            border-radius: 15px;
            border: 1px solid #ffeaa7;
        }

        label { 
            font-weight: bold; 
            font-size: 14px; 
            display: block; 
            margin-bottom: 5px;
            color: #d35400;
        }

        .input-group { 
            display: flex; 
            align-items: center; 
            background: white;
            border: 2px solid #fab1a0; 
            border-radius: 10px; 
            transition: 0.3s;
        }

        .input-group:focus-within { border-color: var(--primary); }

        input { 
            flex: 1;
            padding: 10px; 
            font-size: 16px; 
            border: none; 
            outline: none;
            background: transparent;
            width: 100%;
            font-weight: 600;
        }

        .feedback { margin: 0 10px; font-weight: bold; width: 20px; text-align: center; }

        .buttons { margin-top: 30px; display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        
        button.main-btn { 
            padding: 15px; 
            border: none; 
            border-radius: 15px; 
            font-weight: bold; 
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: 0.2s;
        }

        #btnVerificar { background: var(--primary); color: white; box-shadow: 0 4px 0 #d35400; }
        #btnVerificar:active { transform: translateY(3px); box-shadow: none; }
        
        #btnReset { background: #bdc3c7; color: white; box-shadow: 0 4px 0 #95a5a6; }
        #btnReset:active { transform: translateY(3px); box-shadow: none; }

        .score-board { 
            text-align: center; 
            margin-top: 25px; 
            padding: 15px;
            border-radius: 15px;
            display: none;
            font-size: 18px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>🍽️ OBJETOS DEL COMEDOR</h2>
    <p class="subtitle">Escribe la palabra en inglés. ¡Escúchala al acertar! 🔊</p>

    <div class="image-container">
        <img src="comedor.png" 
             onerror="this.src='https://i.imgur.com/v9Y7S3n.png'" 
             alt="Objetos del comedor" 
             class="main-image">
    </div>

    <div id="quiz"></div>

    <div class="score-board" id="score"></div>

    <div class="buttons">
        <button id="btnReset" class="main-btn">BORRAR TODO</button>
        <button id="btnVerificar" class="main-btn">VERIFICAR</button>
    </div>
</div>

<script>
    // Vocabulario extraído de la imagen proporcionada
    const objetos = [
        { es: "Tenedor", en: "fork" },
        { es: "Cuchara", en: "spoon" },
        { es: "Cuchillo", en: "knife" },
        { es: "Vaso", en: "glass" },
        { es: "Botella", en: "bottle" },
        { es: "Silla", en: "chair" },
        { es: "Mesa", en: "table" },
        { es: "Tijeras", en: "scissors" }
    ];

    const quizContainer = document.getElementById('quiz');
    const scoreBoard = document.getElementById('score');

    // Función de voz
    function pronunciar(texto) {
        const msg = new SpeechSynthesisUtterance(texto);
        msg.lang = 'en-US'; 
        msg.rate = 0.85; 
        window.speechSynthesis.speak(msg);
    }

    // Generar inputs automáticamente
    objetos.forEach((obj, i) => {
        const div = document.createElement('div');
        div.className = 'row';
        div.innerHTML = `
            <label>${i+1}. ${obj.es}</label>
            <div class="input-group">
                <input type="text" class="respuesta" data-correcta="${obj.en}" placeholder="..." autocomplete="off">
                <span class="feedback"></span>
            </div>
        `;
        quizContainer.appendChild(div);
    });

    const campos = document.querySelectorAll('.respuesta');
    const avisos = document.querySelectorAll('.feedback');

    function verificar() {
        let aciertos = 0;
        campos.forEach((campo, i) => {
            const escrita = campo.value.trim().toLowerCase();
            const correcta = campo.getAttribute('data-correcta');

            if (escrita === correcta && escrita !== "") {
                avisos[i].innerText = "✓";
                avisos[i].style.color = "var(--success)";
                campo.parentElement.style.borderColor = "var(--success)";
                aciertos++;
                pronunciar(correcta); // Suena solo si es correcta
            } else {
                avisos[i].innerText = "✗";
                avisos[i].style.color = "var(--error)";
                campo.parentElement.style.borderColor = "var(--error)";
            }
        });

        scoreBoard.style.display = "block";
        if (aciertos === objetos.length) {
            scoreBoard.innerText = "¡BUEN PROVECHO! 🍴 ¡Lo has hecho genial!";
            scoreBoard.style.background = "#eafaf1";
            scoreBoard.style.color = "var(--success)";
        } else {
            scoreBoard.innerText = `Has acertado ${aciertos} de ${objetos.length}`;
            scoreBoard.style.background = "#fff1f0";
            scoreBoard.style.color = "var(--error)";
        }
    }

    document.getElementById('btnVerificar').addEventListener('click', verificar);
    
    document.getElementById('btnReset').addEventListener('click', () => {
        campos.forEach(c => {
            c.value = "";
            c.parentElement.style.borderColor = "#fab1a0";
        });
        avisos.forEach(a => a.innerText = "");
        scoreBoard.style.display = "none";
    });

    // Enter para saltar de campo
    campos.forEach((campo, index) => {
        campo.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                if (index < campos.length - 1) {
                    campos[index + 1].focus();
                } else {
                    verificar();
                }
            }
        });
    });
</script>

</body>
</html>
