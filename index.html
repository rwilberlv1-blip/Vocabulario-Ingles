<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Repaso Inglés: Transports</title>
    <style>
        :root {
            --primary: #4a90e2; /* Azul cielo para temática de transportes */
            --success: #55E6C1;
            --error: #FF4D4D;
            --bg: #F0F4F8;
        }

        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg); 
            padding: 20px; 
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .card { 
            background: white; 
            padding: 25px; 
            border-radius: 30px; 
            max-width: 800px; 
            width: 100%;
            box-shadow: 0 15px 35px rgba(0,0,0,0.08);
            border: 4px solid var(--primary);
        }

        h2 { 
            text-align: center; 
            margin-bottom: 5px; 
            color: #2D3436;
            text-transform: uppercase;
            font-size: 24px;
        }

        p.subtitle { 
            text-align: center; 
            color: #636E72; 
            margin-bottom: 20px; 
            font-weight: 500;
        }

        .image-container {
            width: 100%;
            border-radius: 20px;
            margin-bottom: 25px;
            overflow: hidden;
            border: 2px solid #DFE6E9;
            background: white;
        }

        .main-image { width: 100%; height: auto; display: block; }

        #quiz {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        @media (max-width: 600px) { #quiz { grid-template-columns: 1fr; } }

        .row { 
            background: #F1F7FD;
            padding: 12px;
            border-radius: 15px;
            border: 1px solid #D1E1F0;
        }

        label { 
            font-weight: bold; 
            font-size: 14px; 
            display: block; 
            margin-bottom: 5px;
            color: #2D3436;
        }

        .input-group { 
            display: flex; 
            align-items: center; 
            background: white;
            border: 2px solid #BDC3C7; 
            border-radius: 10px; 
            transition: 0.3s;
        }

        .input-group:focus-within { border-color: var(--primary); }

        input { 
            flex: 1;
            padding: 10px; 
            font-size: 16px; 
            border: none; 
            outline: none;
            background: transparent;
            width: 100%;
            font-weight: 600;
        }

        .feedback { margin: 0 10px; font-weight: bold; width: 20px; text-align: center; }

        .buttons { margin-top: 30px; display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        
        button.main-btn { 
            padding: 15px; 
            border: none; 
            border-radius: 15px; 
            font-weight: bold; 
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: 0.2s;
        }

        #btnVerificar { background: var(--primary); color: white; box-shadow: 0 4px 0 #357ABD; }
        #btnVerificar:active { transform: translateY(3px); box-shadow: none; }
        
        #btnReset { background: #B2BEC3; color: white; box-shadow: 0 4px 0 #636E72; }
        #btnReset:active { transform: translateY(3px); box-shadow: none; }

        .score-board { 
            text-align: center; 
            margin-top: 25px; 
            padding: 15px;
            border-radius: 15px;
            display: none;
            font-size: 18px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>🚀 TRANSPORTS</h2>
    <p class="subtitle">Escribe la palabra en inglés. ¡Escúchala al acertar! 🔊</p>

    <div class="image-container">
        <!-- Reemplaza 'transports.jpg' por el nombre de tu archivo local -->
        <img src="transports.jpg" 
             onerror="this.src='https://i.ibb.co/LzhF3Yn/transports.jpg'" 
             alt="Medios de transporte" 
             class="main-image">
    </div>

    <div id="quiz"></div>

    <div class="score-board" id="score"></div>

    <div class="buttons">
        <button id="btnReset" class="main-btn">LIMPIAR TODO</button>
        <button id="btnVerificar" class="main-btn">VERIFICAR</button>
    </div>
</div>

<script>
    // Vocabulario basado en la imagen de transportes
    const transportes = [
        { es: "Autobús", en: "bus" },
        { es: "Barco", en: "boat" },
        { es: "Avión", en: "plane" },
        { es: "Camión", en: "truck" },
        { es: "Helicóptero", en: "helicopter" },
        { es: "Coche", en: "car" },
        { es: "Moto", en: "motorcycle" },
        { es: "Bici", en: "bicycle" },
        { es: "Semáforo", en: "traffic light" }
    ];

    const quizContainer = document.getElementById('quiz');
    const scoreBoard = document.getElementById('score');

    // Función de voz (Web Speech API)
    function pronunciar(texto) {
        const msg = new SpeechSynthesisUtterance(texto);
        msg.lang = 'en-US'; 
        msg.rate = 0.85; 
        window.speechSynthesis.speak(msg);
    }

    // Generar campos de respuesta automáticamente
    transportes.forEach((item, i) => {
        const div = document.createElement('div');
        div.className = 'row';
        div.innerHTML = `
            <label>${i+1}. ${item.es}</label>
            <div class="input-group">
                <input type="text" class="respuesta" data-correcta="${item.en}" placeholder="..." autocomplete="off">
                <span class="feedback"></span>
            </div>
        `;
        quizContainer.appendChild(div);
    });

    const campos = document.querySelectorAll('.respuesta');
    const avisos = document.querySelectorAll('.feedback');

    function verificar() {
        let aciertos = 0;
        campos.forEach((campo, i) => {
            const escrita = campo.value.trim().toLowerCase();
            const correcta = campo.getAttribute('data-correcta');

            if (escrita === correcta && escrita !== "") {
                avisos[i].innerText = "✓";
                avisos[i].style.color = "var(--success)";
                campo.parentElement.style.borderColor = "var(--success)";
                aciertos++;
                // La voz solo se activa en respuestas correctas
                pronunciar(correcta); 
            } else {
                avisos[i].innerText = "✗";
                avisos[i].style.color = "var(--error)";
                campo.parentElement.style.borderColor = "var(--error)";
            }
        });

        scoreBoard.style.display = "block";
        if (aciertos === transportes.length) {
            scoreBoard.innerText = "¡EXCELENTE! 🌟 ¡Dominas los transportes!";
            scoreBoard.style.background = "#EAFBF4";
            scoreBoard.style.color = "var(--success)";
        } else {
            scoreBoard.innerText = `Has logrado ${aciertos} de ${transportes.length}`;
            scoreBoard.style.background = "#FFF5F5";
            scoreBoard.style.color = "var(--error)";
        }
    }

    // Eventos de botones
    document.getElementById('btnVerificar').addEventListener('click', verificar);
    
    document.getElementById('btnReset').addEventListener('click', () => {
        campos.forEach(c => {
            c.value = "";
            c.parentElement.style.borderColor = "#BDC3C7";
        });
        avisos.forEach(a => a.innerText = "");
        scoreBoard.style.display = "none";
    });

    // Navegación con tecla Enter
    campos.forEach((campo, index) => {
        campo.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                if (index < campos.length - 1) {
                    campos[index + 1].focus();
                } else {
                    verificar();
                }
            }
        });
    });
</script>

</body>
</html>
