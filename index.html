<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English: Writing Project - En la Oficina</title>
    <style>
        :root {
            --primary: #54a0ff; /* Azul brillante */
            --success: #1dd1a1;
            --error: #ff6b6b;
            --bg: #f1f2f6;
        }

        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg); 
            padding: 20px; 
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .card { 
            background: white; 
            padding: 25px; 
            border-radius: 30px; 
            max-width: 800px; 
            width: 100%;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            border-top: 8px solid var(--primary);
        }

        h2 { 
            text-align: center; 
            margin-bottom: 5px; 
            color: #2f3542;
            text-transform: uppercase;
        }

        p.subtitle { 
            text-align: center; 
            color: #747d8c; 
            margin-bottom: 20px; 
            font-weight: 500;
        }

        .image-container {
            width: 100%;
            border-radius: 15px;
            margin-bottom: 25px;
            overflow: hidden;
            border: 2px solid #dfe4ea;
        }

        .main-image { width: 100%; height: auto; display: block; }

        #quiz {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        @media (max-width: 600px) { #quiz { grid-template-columns: 1fr; } }

        .row { 
            background: #f8f9fa;
            padding: 12px;
            border-radius: 15px;
            border: 1px solid #e1e4e8;
        }

        label { 
            font-weight: bold; 
            font-size: 14px; 
            display: block; 
            margin-bottom: 5px;
            color: #2f3542;
        }

        .input-group { 
            display: flex; 
            align-items: center; 
            background: white;
            border: 2px solid #ced4da; 
            border-radius: 10px; 
            transition: 0.3s;
        }

        .input-group:focus-within { border-color: var(--primary); }

        input { 
            flex: 1;
            padding: 10px; 
            font-size: 16px; 
            border: none; 
            outline: none;
            background: transparent;
            width: 100%;
            font-weight: 600;
        }

        .feedback { margin: 0 10px; font-weight: bold; width: 20px; text-align: center; }

        .buttons { margin-top: 30px; display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        
        button.main-btn { 
            padding: 15px; 
            border: none; 
            border-radius: 15px; 
            font-weight: bold; 
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        #btnVerificar { background: var(--primary); color: white; box-shadow: 0 4px 0 #2e86de; }
        #btnVerificar:active { transform: translateY(3px); box-shadow: none; }
        
        #btnReset { background: #ced4da; color: #2f3542; box-shadow: 0 4px 0 #a4b0be; }
        #btnReset:active { transform: translateY(3px); box-shadow: none; }

        .score-board { 
            text-align: center; 
            margin-top: 25px; 
            padding: 15px;
            border-radius: 15px;
            display: none;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>💻 EN LA OFICINA / WRITING PROJECT</h2>
    <p class="subtitle">Escribe en inglés y pulsa "Verificar" para escuchar 🔊</p>

    <div class="image-container">
        <!-- Reemplaza 'writing_project.jpg' por el nombre de tu archivo local -->
        <img src="writing_project.jpg" 
             onerror="this.src='https://i.ibb.co/30C9Xh7/oficina.jpg'" 
             alt="Office objects" 
             class="main-image">
    </div>

    <div id="quiz"></div>

    <div class="score-board" id="score"></div>

    <div class="buttons">
        <button id="btnReset" class="main-btn">LIMPIAR</button>
        <button id="btnVerificar" class="main-btn">VERIFICAR</button>
    </div>
</div>

<script>
    // Vocabulario basado exactamente en las etiquetas de la imagen
    const oficina = [
        { es: "Ordenador", en: "computer" },
        { es: "Teclado", en: "keyboard" },
        { es: "Escritorio", en: "desk" },
        { es: "Libro", en: "book" },
        { es: "Ratón", en: "mouse" },
        { es: "Cajón", en: "drawer" },
        { es: "Marca", en: "tick" }, // También puede ser "check"
        { es: "Cruz", en: "cross" }
    ];

    const quizContainer = document.getElementById('quiz');
    const scoreBoard = document.getElementById('score');

    // Función de voz
    function pronunciar(texto) {
        const msg = new SpeechSynthesisUtterance(texto);
        msg.lang = 'en-US'; 
        msg.rate = 0.85; 
        window.speechSynthesis.speak(msg);
    }

    // Generar campos de respuesta
    oficina.forEach((item, i) => {
        const div = document.createElement('div');
        div.className = 'row';
        div.innerHTML = `
            <label>${i+1}. ${item.es}</label>
            <div class="input-group">
                <input type="text" class="respuesta" data-correcta="${item.en}" placeholder="..." autocomplete="off">
                <span class="feedback"></span>
            </div>
        `;
        quizContainer.appendChild(div);
    });

    const campos = document.querySelectorAll('.respuesta');
    const avisos = document.querySelectorAll('.feedback');

    function verificar() {
        let aciertos = 0;
        campos.forEach((campo, i) => {
            const escrita = campo.value.trim().toLowerCase();
            const correcta = campo.getAttribute('data-correcta');

            // Lógica especial para 'tick/check'
            let esCorrecto = (escrita === correcta);
            if (correcta === "tick" && escrita === "check") esCorrecto = true;

            if (esCorrecto && escrita !== "") {
                avisos[i].innerText = "✓";
                avisos[i].style.color = "var(--success)";
                campo.parentElement.style.borderColor = "var(--success)";
                aciertos++;
                pronunciar(escrita); // Suena automáticamente al acertar
            } else {
                avisos[i].innerText = "✗";
                avisos[i].style.color = "var(--error)";
                campo.parentElement.style.borderColor = "var(--error)";
            }
        });

        scoreBoard.style.display = "block";
        if (aciertos === oficina.length) {
            scoreBoard.innerText = "¡PROYECTO COMPLETADO! 🌟 ¡Excelente trabajo!";
            scoreBoard.style.background = "#eafaf1";
            scoreBoard.style.color = "var(--success)";
        } else {
            scoreBoard.innerText = `Has logrado ${aciertos} de ${oficina.length}`;
            scoreBoard.style.background = "#fff1f0";
            scoreBoard.style.color = "var(--error)";
        }
    }

    document.getElementById('btnVerificar').addEventListener('click', verificar);
    
    document.getElementById('btnReset').addEventListener('click', () => {
        campos.forEach(c => {
            c.value = "";
            c.parentElement.style.borderColor = "#ced4da";
        });
        avisos.forEach(a => a.innerText = "");
        scoreBoard.style.display = "none";
    });

    // Navegación con Enter
    campos.forEach((campo, index) => {
        campo.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                if (index < campos.length - 1) {
                    campos[index + 1].focus();
                } else {
                    verificar();
                }
            }
        });
    });
</script>

</body>
</html>
