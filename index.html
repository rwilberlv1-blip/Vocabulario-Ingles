<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Repaso Inglés: Proyecto de Escritura</title>
    <style>
        :root {
            --primary: #a29bfe; /* Morado pastel suave */
            --success: #00b894;
            --error: #d63031;
            --bg: #f4f5f7;
        }

        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg); 
            padding: 20px; 
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .card { 
            background: white; 
            padding: 25px; 
            border-radius: 30px; 
            max-width: 800px; 
            width: 100%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            border-top: 8px solid var(--primary);
        }

        h2 { 
            text-align: center; 
            margin-bottom: 5px; 
            color: #2d3436;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        p.subtitle { 
            text-align: center; 
            color: #636e72; 
            margin-bottom: 25px; 
            font-weight: 500;
        }

        .image-container {
            width: 100%;
            border-radius: 15px;
            margin-bottom: 25px;
            overflow: hidden;
            border: 2px solid #dfe6e9;
            background: #fff;
        }

        .main-image { width: 100%; height: auto; display: block; }

        #quiz {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 15px;
        }

        @media (max-width: 768px) { #quiz { grid-template-columns: 1fr 1fr; } }
        @media (max-width: 480px) { #quiz { grid-template-columns: 1fr; } }

        .row { 
            background: #fdfdfd;
            padding: 12px;
            border-radius: 15px;
            border: 1px solid #e1e4e8;
        }

        label { 
            font-weight: bold; 
            font-size: 14px; 
            display: block; 
            margin-bottom: 8px;
            color: #2d3436;
            text-align: center;
        }

        .input-group { 
            display: flex; 
            align-items: center; 
            background: white;
            border: 2px solid #dfe6e9; 
            border-radius: 10px; 
            transition: 0.3s;
        }

        .input-group:focus-within { border-color: var(--primary); }

        input { 
            flex: 1;
            padding: 10px; 
            font-size: 15px; 
            border: none; 
            outline: none;
            background: transparent;
            width: 100%;
            font-weight: 600;
            text-align: center;
        }

        .feedback { font-weight: bold; width: 25px; text-align: center; }

        .buttons { margin-top: 30px; display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        
        button.main-btn { 
            padding: 15px; 
            border: none; 
            border-radius: 15px; 
            font-weight: bold; 
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: 0.2s;
        }

        #btnVerificar { background: var(--primary); color: white; box-shadow: 0 4px 0 #6c5ce7; }
        #btnVerificar:active { transform: translateY(3px); box-shadow: none; }
        
        #btnReset { background: #b2bec3; color: white; box-shadow: 0 4px 0 #636e72; }
        #btnReset:active { transform: translateY(3px); box-shadow: none; }

        .score-board { 
            text-align: center; 
            margin-top: 25px; 
            padding: 15px;
            border-radius: 15px;
            display: none;
            font-size: 18px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>📝 PROYECTO DE ESCRITURA</h2>
    <p class="subtitle">Escribe la palabra en inglés. ¡Escúchala al acertar! 🔊</p>

    <div class="image-container">
        <!-- Referencia exacta al archivo de la imagen que proporcionaste -->
        <img src="objetos.png" 
             alt="Vocabulario Proyecto de Escritura" 
             class="main-image">
    </div>

    <div id="quiz"></div>

    <div class="score-board" id="score"></div>

    <div class="buttons">
        <button id="btnReset" class="main-btn">LIMPIAR TODO</button>
        <button id="btnVerificar" class="main-btn">VERIFICAR</button>
    </div>
</div>

<script>
    // Vocabulario basado en las etiquetas de la imagen
    const vocabulario = [
        { es: "Luz", en: "light" },
        { es: "Agua", en: "water" },
        { es: "Arena", en: "sand" },
        { es: "Piedra", en: "stone" },
        { es: "Banco", en: "bench" },
        { es: "Peluche", en: "teddy bear" },
        { es: "Balón", en: "ball" },
        { es: "Mochila escolar", en: "school bag" },
        { es: "Bicicleta", en: "bicycle" }
    ];

    const quizContainer = document.getElementById('quiz');
    const scoreBoard = document.getElementById('score');

    // Función de voz (Pronunciación en inglés)
    function pronunciar(texto) {
        const msg = new SpeechSynthesisUtterance(texto);
        msg.lang = 'en-US'; 
        msg.rate = 0.85; 
        window.speechSynthesis.speak(msg);
    }

    // Generar los campos de respuesta automáticamente
    vocabulario.forEach((item, i) => {
        const div = document.createElement('div');
        div.className = 'row';
        div.innerHTML = `
            <label>${i+1}. ${item.es}</label>
            <div class="input-group">
                <input type="text" class="respuesta" data-correcta="${item.en}" placeholder="..." autocomplete="off">
                <span class="feedback"></span>
            </div>
        `;
        quizContainer.appendChild(div);
    });

    const campos = document.querySelectorAll('.respuesta');
    const avisos = document.querySelectorAll('.feedback');

    function verificar() {
        let aciertos = 0;
        campos.forEach((campo, i) => {
            const escrita = campo.value.trim().toLowerCase();
            const correcta = campo.getAttribute('data-correcta');

            // Flexibilidad para sinónimos comunes en inglés
            let esCorrecto = (escrita === correcta);
            if (correcta === "bicycle" && escrita === "bike") esCorrecto = true;
            if (correcta === "school bag" && escrita === "backpack") esCorrecto = true;
            if (correcta === "teddy bear" && escrita === "teddy") esCorrecto = true;
            if (correcta === "stone" && escrita === "rock") esCorrecto = true;

            if (esCorrecto && escrita !== "") {
                avisos[i].innerText = "✓";
                avisos[i].style.color = "var(--success)";
                campo.parentElement.style.borderColor = "var(--success)";
                aciertos++;
                // Pronunciar la palabra que el niño escribió (ej. si puso 'bike', dirá 'bike')
                pronunciar(escrita);
            } else {
                avisos[i].innerText = "✗";
                avisos[i].style.color = "var(--error)";
                campo.parentElement.style.borderColor = "var(--error)";
            }
        });

        scoreBoard.style.display = "block";
        if (aciertos === vocabulario.length) {
            scoreBoard.innerText = "¡EXCELENTE! ✨ Has completado el proyecto.";
            scoreBoard.style.background = "#eafaf1";
            scoreBoard.style.color = "var(--success)";
        } else {
            scoreBoard.innerText = `¡Sigue intentando! Llevas ${aciertos} de ${vocabulario.length}`;
            scoreBoard.style.background = "#fff1f0";
            scoreBoard.style.color = "var(--error)";
        }
    }

    // Eventos de los botones
    document.getElementById('btnVerificar').addEventListener('click', verificar);
    
    document.getElementById('btnReset').addEventListener('click', () => {
        campos.forEach(c => {
            c.value = "";
            c.parentElement.style.borderColor = "#dfe6e9";
        });
        avisos.forEach(a => a.innerText = "");
        scoreBoard.style.display = "none";
    });

    // Navegación rápida con tecla Enter
    campos.forEach((campo, index) => {
        campo.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                if (index < campos.length - 1) {
                    campos[index + 1].focus();
                } else {
                    verificar();
                }
            }
        });
    });
</script>

</body>
</html>
