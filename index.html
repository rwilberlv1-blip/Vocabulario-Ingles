<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Repaso Inglés: Objetos de la Escuela</title>
    <style>
        :root {
            --primary: #FF9F43; 
            --success: #34c759;
            --error: #ff3b30;
            --bg: #f4f4f9;
        }

        body { 
            font-family: -apple-system, system-ui, sans-serif;
            background: var(--bg); 
            padding: 20px; 
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .card { 
            background: white; 
            padding: 24px; 
            border-radius: 20px; 
            max-width: 600px; 
            width: 100%;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
        }

        h2 { text-align: center; margin-bottom: 5px; color: #1c1c1e; }
        p.subtitle { text-align: center; color: #8e8e93; margin-bottom: 20px; }

        .school-image-container {
            width: 100%;
            border-radius: 15px;
            margin-bottom: 25px;
            overflow: hidden;
            border: 1px solid #e5e5ea;
            background: #eee;
        }

        .school-image { width: 100%; height: auto; display: block; }

        #quiz {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        @media (max-width: 500px) { #quiz { grid-template-columns: 1fr; } }

        .row { margin-bottom: 5px; }
        label { font-weight: 600; font-size: 14px; display: block; margin-bottom: 4px; }
        .spanish-word { color: #8e8e93; font-style: italic; font-weight: normal; }

        .input-group { 
            display: flex; 
            align-items: center; 
            background: #fafafa;
            border: 2px solid #e5e5ea; 
            border-radius: 10px; 
            transition: all 0.2s;
        }

        .input-group:focus-within { 
            border-color: var(--primary); 
            background: white; 
        }

        input { 
            flex: 1;
            padding: 12px; 
            font-size: 16px; 
            border: none; 
            outline: none;
            background: transparent;
            width: 100%;
        }

        .feedback { margin: 0 10px; font-weight: bold; width: 20px; text-align: center; }

        .buttons { margin-top: 30px; display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        
        button.main-btn { 
            padding: 16px; 
            border: none; 
            border-radius: 12px; 
            font-weight: bold; 
            cursor: pointer;
            text-transform: uppercase;
            font-size: 14px;
        }

        #btnVerificar { background: var(--primary); color: white; }
        #btnReset { background: #e5e5ea; color: #3a3a3c; }

        .score-board { 
            text-align: center; 
            margin-top: 25px; 
            padding: 15px;
            border-radius: 12px;
            display: none;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>EN LA ESCUELA</h2>
    <p class="subtitle">Escribe en inglés. ¡Si aciertas, escucharás la palabra! 🎧</p>

    <div class="school-image-container">
        <img src="escuela.png" 
             onerror="this.src='https://i.imgur.com/8Qj8j9v.png'" 
             alt="Objetos escolares" 
             class="school-image">
    </div>

    <div id="quiz"></div>

    <div class="score-board" id="score"></div>

    <div class="buttons">
        <button id="btnReset" class="main-btn">LIMPIAR</button>
        <button id="btnVerificar" class="main-btn">VERIFICAR</button>
    </div>
</div>

<script>
    // Lista de palabras actualizada: Mesa -> Escritorio (desk)
    const palabras = [
        { es: "Escritorio", en: "desk" },
        { es: "Silla", en: "chair" },
        { es: "Libro", en: "book" },
        { es: "Regla", en: "ruler" },
        { es: "Bolígrafo", en: "pen" },
        { es: "Lápiz", en: "pencil" },
        { es: "Goma", en: "rubber" }
    ];

    const quizContainer = document.getElementById('quiz');
    const scoreBoard = document.getElementById('score');

    // Función de voz
    function pronunciar(texto) {
        const msg = new SpeechSynthesisUtterance(texto);
        msg.lang = 'en-US'; 
        msg.rate = 0.85; 
        window.speechSynthesis.speak(msg);
    }

    // Generar el HTML de las preguntas
    palabras.forEach((p, i) => {
        const div = document.createElement('div');
        div.className = 'row';
        div.innerHTML = `
            <label>${i+1}. <span class="spanish-word">(${p.es})</span></label>
            <div class="input-group">
                <input type="text" class="respuesta" data-correcta="${p.en}" placeholder="..." autocomplete="off">
                <span class="feedback"></span>
            </div>
        `;
        quizContainer.appendChild(div);
    });

    const campos = document.querySelectorAll('.respuesta');
    const avisos = document.querySelectorAll('.feedback');

    function verificar() {
        let aciertos = 0;
        campos.forEach((campo, i) => {
            const escrita = campo.value.trim().toLowerCase();
            const correcta = campo.getAttribute('data-correcta');

            if (escrita === correcta && escrita !== "") {
                avisos[i].innerText = "✓";
                avisos[i].style.color = "var(--success)";
                campo.parentElement.style.borderColor = "var(--success)";
                aciertos++;
                // Sonido solo si es correcta
                pronunciar(correcta);
            } else {
                avisos[i].innerText = "✗";
                avisos[i].style.color = "var(--error)";
                campo.parentElement.style.borderColor = "var(--error)";
            }
        });

        scoreBoard.style.display = "block";
        if (aciertos === campos.length) {
            scoreBoard.innerText = "¡Excelente! 🌟 Vocabulario completado.";
            scoreBoard.style.background = "#eafaf1";
            scoreBoard.style.color = "var(--success)";
        } else {
            scoreBoard.innerText = `Aciertos: ${aciertos} de ${campos.length}`;
            scoreBoard.style.background = "#fff1f0";
            scoreBoard.style.color = "var(--error)";
        }
    }

    // Botones de control
    document.getElementById('btnVerificar').addEventListener('click', verificar);
    
    document.getElementById('btnReset').addEventListener('click', () => {
        campos.forEach(c => {
            c.value = "";
            c.parentElement.style.borderColor = "#e5e5ea";
        });
        avisos.forEach(a => a.innerText = "");
        scoreBoard.style.display = "none";
    });

    // Navegación con Enter
    campos.forEach((campo, index) => {
        campo.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                if (index < campos.length - 1) {
                    campos[index + 1].focus();
                } else {
                    verificar();
                }
            }
        });
    });
</script>

</body>
</html>
