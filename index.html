<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Repaso Inglés: Family Members</title>
    <style>
        :root {
            --primary: #007aff; /* Azul para diferenciarlo de los otros niveles */
            --success: #34c759;
            --error: #ff3b30;
            --bg: #f2f2f7;
        }

        body { 
            font-family: -apple-system, sans-serif; 
            background: var(--bg); 
            padding: 20px; 
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .card { 
            background: white; 
            padding: 24px; 
            border-radius: 20px; 
            max-width: 500px; 
            width: 100%;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        h2 { text-align: center; margin-bottom: 5px; color: #1c1c1e; }
        p.subtitle { text-align: center; color: #8e8e93; margin-bottom: 15px; font-size: 14px; }

        /* Estilos para la imagen central */
        .house-image {
            width: 100%;
            height: auto;
            border-radius: 15px;
            margin-bottom: 25px;
            border: 1px solid #e5e5ea;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        .row { margin-bottom: 12px; }
        label { font-weight: 600; font-size: 13px; color: #8e8e93; display: block; margin-bottom: 5px; }

        .input-group { display: flex; align-items: center; }
        input { 
            flex: 1;
            padding: 10px 15px; 
            font-size: 16px; 
            border: 2px solid #e5e5ea; 
            border-radius: 10px; 
            outline: none;
            transition: all 0.2s;
        }

        input:focus { border-color: var(--primary); }

        .feedback { margin-left: 10px; font-weight: bold; width: 20px; }
        .buttons { margin-top: 25px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        
        button { 
            padding: 15px; 
            border: none; 
            border-radius: 12px; 
            font-weight: bold; 
            cursor: pointer;
            transition: transform 0.1s, opacity 0.2s;
        }

        button:active { transform: scale(0.98); opacity: 0.9; }

        #btnVerificar { background: var(--primary); color: white; }
        #btnReset { background: #e5e5ea; color: #3a3a3c; }

        .score-board { 
            text-align: center; 
            margin-top: 20px; 
            font-weight: bold; 
            display: none; 
            padding: 15px;
            border-radius: 12px;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>MIEMBROS DE LA FAMILIA</h2>
    <p class="subtitle">Observa la imagen y escribe los nombres en inglés</p>

    <img src="miembros_familia.png" alt="Árbol genealógico ilustrado con miembros de la familia" class="house-image">

    <div id="quiz">
        <div class="row">
            <label>1. Hija</label>
            <div class="input-group">
                <input type="text" class="respuesta" data-correcta="daughter" placeholder="English...">
                <span class="feedback"></span>
            </div>
        </div>
        <div class="row">
            <label>2. Padre</label>
            <div class="input-group">
                <input type="text" class="respuesta" data-correcta="father" placeholder="English...">
                <span class="feedback"></span>
            </div>
        </div>
        <div class="row">
            <label>3. Madre</label>
            <div class="input-group">
                <input type="text" class="respuesta" data-correcta="mother" placeholder="English...">
                <span class="feedback"></span>
            </div>
        </div>
        <div class="row">
            <label>4. Padres</label>
            <div class="input-group">
                <input type="text" class="respuesta" data-correcta="parents" placeholder="English...">
                <span class="feedback"></span>
            </div>
        </div>
        <div class="row">
            <label>5. Hijo</label>
            <div class="input-group">
                <input type="text" class="respuesta" data-correcta="son" placeholder="English...">
                <span class="feedback"></span>
            </div>
        </div>
        <div class="row">
            <label>6. Abuela</label>
            <div class="input-group">
                <input type="text" class="respuesta" data-correcta="grandmother" placeholder="English...">
                <span class="feedback"></span>
            </div>
        </div>
        <div class="row">
            <label>7. Abuelo</label>
            <div class="input-group">
                <input type="text" class="respuesta" data-correcta="grandfather" placeholder="English...">
                <span class="feedback"></span>
            </div>
        </div>
        <div class="row">
            <label>8. Primo</label>
            <div class="input-group">
                <input type="text" class="respuesta" data-correcta="cousin" placeholder="English...">
                <span class="feedback"></span>
            </div>
        </div>
    </div>

    <div class="score-board" id="score"></div>

    <div class="buttons">
        <button id="btnReset">LIMPIAR</button>
        <button id="btnVerificar">VERIFICAR</button>
    </div>
</div>

<script>
    const btnVerificar = document.getElementById('btnVerificar');
    const btnReset = document.getElementById('btnReset');
    const campos = document.querySelectorAll('.respuesta');
    const avisos = document.querySelectorAll('.feedback');
    const scoreBoard = document.getElementById('score');

    function verificar() {
        let aciertos = 0;
        campos.forEach((campo, i) => {
            // Usamos trim() para quitar espacios extra y toLowerCase() para ignorar mayúsculas
            const escrita = campo.value.trim().toLowerCase();
            const correcta = campo.getAttribute('data-correcta');

            if (escrita === correcta && escrita !== "") {
                avisos[i].innerText = "✓";
                avisos[i].style.color = "var(--success)";
                campo.style.borderColor = "var(--success)";
                aciertos++;
            } else {
                avisos[i].innerText = "✗";
                avisos[i].style.color = "var(--error)";
                campo.style.borderColor = "var(--error)";
            }
        });

        scoreBoard.innerText = `Puntuación: ${aciertos} de ${campos.length}`;
        scoreBoard.style.display = "block";
        scoreBoard.style.background = aciertos === campos.length ? "#eafaf1" : "#fefefe";
        scoreBoard.style.color = aciertos === campos.length ? "var(--success)" : "#1c1c1e";
        
        if(aciertos === campos.length) {
            scoreBoard.innerText = "¡Perfecto! 👨‍👩‍👧‍👦✨ Excellent job!";
        }
    }

    function resetear() {
        campos.forEach((campo, i) => {
            campo.value = "";
            campo.style.borderColor = "#e5e5ea";
            avisos[i].innerText = "";
        });
        scoreBoard.style.display = "none";
    }

    btnVerificar.addEventListener('click', verificar);
    btnReset.addEventListener('click', resetear);

    // Funcionalidad para saltar al siguiente campo con "Enter"
    campos.forEach((campo, index) => {
        campo.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                if (index < campos.length - 1) {
                    campos[index + 1].focus();
                } else {
                    verificar();
                }
            }
        });
    });
</script>

</body>
</html>
